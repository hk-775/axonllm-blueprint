name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install dependencies
        run: npm run setup
      - name: Verify
        run: npm run verify
      - name: Audit dependencies
        run: npm run audit:dependencies
      - name: Verify registry signatures
        run: npm run audit:signatures
      - name: Generate CycloneDX SBOMs
        run: |
          mkdir -p sbom
          npm --prefix backend sbom --sbom-format cyclonedx > sbom/backend.cdx.json
          npm --prefix frontend sbom --sbom-format cyclonedx > sbom/frontend.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: production-builds
          path: |
            backend/dist
            frontend/dist
            sbom
          if-no-files-found: error

  container:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build container
        run: docker build --pull --tag axonllm-blueprint:ci .
      - name: Scan container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: axonllm-blueprint:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
